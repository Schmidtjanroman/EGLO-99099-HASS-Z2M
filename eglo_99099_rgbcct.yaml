blueprint:
  name: EGLO 99099 Remote - Zigbee2MQTT RGB-CCT Steuerung (v0.22)
  description: >
    Version: 0.22
    Die Tasten Rot, Grün und Blau nutzen nun ein mathematisches Raster (Snapping) in Kombination mit einer konfigurierbaren Schrittweite. 
    Dadurch wird das Einfrieren der Werte durch Rundungsfehler der Zigbee-XY-Konvertierung verhindert und ein linearer Durchlauf bis 255 (mit anschließendem Reset auf 0) erzwungen.
  domain: automation
  input:
    mqtt_topic:
      name: Zigbee2MQTT Base Topic
      description: Das MQTT-Topic der Fernbedienung (z. B. zigbee2mqtt/Paula Remote).
      default: "zigbee2mqtt/Paula Remote"
      selector:
        text:
          multiline: false
    remote_group:
      name: Zu steuernde Gruppe
      description: Auf welche Taste/Gruppe der Fernbedienung soll reagiert werden?
      default: "all"
      selector:
        select:
          options:
            - label: "Alle Gruppen (Gruppe ignorieren)"
              value: "all"
            - label: "Gruppe 1"
              value: "1"
            - label: "Gruppe 2"
              value: "2"
            - label: "Gruppe 3"
              value: "3"
    target_light:
      name: LED-Streifen
      description: Der zu steuernde RGB-CCT LED-Streifen (z. B. light.hochbett).
      selector:
        entity:
          filter:
            - domain: light
    favorite_1_color:
      name: Favorit 1 RGB-Farbe (Recall_1)
      default: [255, 140, 0]
      selector:
        color_rgb: {}
    favorite_2_color:
      name: Favorit 2 RGB-Farbe (Recall_2)
      default: [160, 32, 240]
      selector:
        color_rgb: {}
    brightness_step:
      name: Helligkeitsschritt (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"
          mode: slider
    cct_step:
      name: Farbtemperaturschritt (Kelvin)
      default: 400
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: "K"
          mode: slider
    rgb_step:
      name: RGB-Farbkanalschritt
      description: Erhöhung pro Tastendruck (Empfehlung 51 für 5 exakte Schritte).
      default: 51
      selector:
        number:
          min: 10
          max: 255
          step: 1
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: mqtt
    topic: !input mqtt_topic

condition: []

action:
  - variables:
      selected_grp: !input remote_group
      light_entity: !input target_light
      step_pct: !input brightness_step
      step_k: !input cct_step
      rgb_step: !input rgb_step
      fav1: !input favorite_1_color
      fav2: !input favorite_2_color
      action_trigger: >
        {% if trigger.payload_json is defined and trigger.payload_json is mapping and 'action' in trigger.payload_json %}
          {{ trigger.payload_json.action | string }}
        {% else %}
          {{ '' }}
        {% endif %}
      current_group: >
        {% if trigger.payload_json is defined and trigger.payload_json is mapping and 'action_group' in trigger.payload_json %}
          {{ trigger.payload_json.action_group }}
        {% else %}
          {{ '' }}
        {% endif %}

  - condition: template
    value_template: >
      {{ action_trigger not in ['', 'None', 'unknown', 'unavailable', 'none'] and (selected_grp | string == 'all' or current_group | string == selected_grp | string) }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'on' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ light_entity }}"

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'brightness_step_up' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness_step_pct: "{{ step_pct }}"

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'brightness_step_down' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness_step_pct: "{{ -1 * step_pct }}"

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'color_temperature_step_up' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              color_temp_kelvin: >
                {% set cur_k = state_attr(light_entity, 'color_temp_kelvin') | default(3000, true) | int %}
                {% set max_k = state_attr(light_entity, 'max_color_temp_kelvin') | default(6500, true) | int %}
                {{ [cur_k + step_k, max_k] | min }}

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'color_temperature_step_down' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              color_temp_kelvin: >
                {% set cur_k = state_attr(light_entity, 'color_temp_kelvin') | default(3000, true) | int %}
                {% set min_k = state_attr(light_entity, 'min_color_temp_kelvin') | default(2200, true) | int %}
                {{ [cur_k - step_k, min_k] | max }}

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'red' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: >
                {% set cur_rgb = state_attr(light_entity, 'rgb_color') or [0, 0, 0] %}
                {% set snapped = ((cur_rgb[0] / rgb_step) | round(0) * rgb_step) | int %}
                {% set next_val = 0 if snapped >= (255 - (rgb_step / 2)) else [snapped + rgb_step, 255] | min %}
                {{ [next_val, cur_rgb[1], cur_rgb[2]] }}

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'green' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: >
                {% set cur_rgb = state_attr(light_entity, 'rgb_color') or [0, 0, 0] %}
                {% set snapped = ((cur_rgb[1] / rgb_step) | round(0) * rgb_step) | int %}
                {% set next_val = 0 if snapped >= (255 - (rgb_step / 2)) else [snapped + rgb_step, 255] | min %}
                {{ [cur_rgb[0], next_val, cur_rgb[2]] }}

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'blue' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: >
                {% set cur_rgb = state_attr(light_entity, 'rgb_color') or [0, 0, 0] %}
                {% set snapped = ((cur_rgb[2] / rgb_step) | round(0) * rgb_step) | int %}
                {% set next_val = 0 if snapped >= (255 - (rgb_step / 2)) else [snapped + rgb_step, 255] | min %}
                {{ [cur_rgb[0], cur_rgb[1], next_val] }}

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'recall_1' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: "{{ fav1 }}"

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'recall_2' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: "{{ fav2 }}"

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'refresh_colored' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              hs_color: >
                {% set cur_hs = state_attr(light_entity, 'hs_color') %}
                {% set cur_mode = state_attr(light_entity, 'color_mode') %}
                {% if cur_hs is none or cur_mode not in ['hs', 'xy', 'rgb'] %}
                  [0, 100]
                {% else %}
                  {% set next_h = (cur_hs[0] + 22.5) | round(1) %}
                  [{{ next_h if next_h < 360 else next_h - 360 }}, 100]
                {% endif %}

      - conditions:
          - condition: template
            value_template: "{{ action_trigger == 'refresh' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light_entity, 'color_mode') == 'color_temp' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ light_entity }}"
                    data:
                      rgb_color: [255, 0, 0]
            default:
              - action: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"
                data:
                  color_temp_kelvin: 3000
