blueprint:
  name: EGLO 99099 Remote - Zigbee2MQTT RGB-CCT Steuerung
  description: Steuerung eines RGB-CCT LED-Streifens über die EGLO 99099 Fernbedienung via Zigbee2MQTT mit Geräteauswahl, Gruppen-Dropdown und 16-stufigem Farbzyklus.
  domain: automation
  input:
    remote_device:
      name: Fernbedienung
      description: Die EGLO 99099 Fernbedienung auswählen.
      selector:
        device:
          integration: mqtt
          manufacturer: EGLO
          model: 3 groups remote controller
    remote_group:
      name: Fernbedienungsgruppe
      description: Auf welche Taste/Gruppe der Fernbedienung soll reagiert werden?
      default: "all"
      selector:
        select:
          options:
            - label: "Alle Gruppen (Gruppe ignorieren)"
              value: "all"
            - label: "Gruppe 1"
              value: "1"
            - label: "Gruppe 2"
              value: "2"
            - label: "Gruppe 3"
              value: "3"
    target_light:
      name: LED-Streifen
      description: Der zu steuernde RGB-CCT LED-Streifen.
      selector:
        entity:
          filter:
            - domain: light
    favorite_1_color:
      name: Favorit 1 RGB-Farbe (Recall_1)
      default: [255, 140, 0]
      selector:
        color_rgb: {}
    favorite_2_color:
      name: Favorit 2 RGB-Farbe (Recall_2)
      default: [160, 32, 240]
      selector:
        color_rgb: {}
    brightness_step:
      name: Helligkeitsschritt (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"
          mode: slider
    cct_step:
      name: Farbtemperaturschritt (Kelvin)
      default: 400
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: "K"
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: ""
    discovery_id: ~

condition:
  - condition: template
    value_template: >
      {% set selected_grp = input_remote_group | default('all') | string %}
      {% set event_grp = trigger.event.data.action_group | default(none) | string %}
      {{ selected_grp == 'all' or event_grp == selected_grp }}

action:
  - variables:
      action: "{{ trigger.event.data.action | default(trigger.payload | default('')) }}"
      light_entity: !input target_light
      step_pct: !input brightness_step
      step_k: !input cct_step
      fav1: !input favorite_1_color
      fav2: !input favorite_2_color

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ action == 'on' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ light_entity }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'brightness_step_up' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness_step_pct: "{{ step_pct }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'brightness_step_down' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness_step_pct: "{{ -1 * step_pct }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'color_temperature_step_up' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              color_temp_kelvin: >
                {% set cur_k = state_attr(light_entity, 'color_temp_kelvin') | default(3000, true) | int %}
                {% set max_k = state_attr(light_entity, 'max_color_temp_kelvin') | default(6500, true) | int %}
                {{ [cur_k + step_k, max_k] | min }}

      - conditions:
          - condition: template
            value_template: "{{ action == 'color_temperature_step_down' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              color_temp_kelvin: >
                {% set cur_k = state_attr(light_entity, 'color_temp_kelvin') | default(3000, true) | int %}
                {% set min_k = state_attr(light_entity, 'min_color_temp_kelvin') | default(2200, true) | int %}
                {{ [cur_k - step_k, min_k] | max }}

      - conditions:
          - condition: template
            value_template: "{{ action == 'red' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: [255, 0, 0]

      - conditions:
          - condition: template
            value_template: "{{ action == 'green' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: [0, 255, 0]

      - conditions:
          - condition: template
            value_template: "{{ action == 'blue' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: [0, 0, 255]

      - conditions:
          - condition: template
            value_template: "{{ action == 'recall_1' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: "{{ fav1 }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'recall_2' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: "{{ fav2 }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'refresh_colored' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: >
                {% set palette = [
                  [255, 0, 0],
                  [255, 64, 0],
                  [255, 128, 0],
                  [255, 192, 0],
                  [255, 255, 0],
                  [128, 255, 0],
                  [0, 255, 0],
                  [0, 255, 128],
                  [0, 255, 255],
                  [0, 128, 255],
                  [0, 0, 255],
                  [75, 0, 255],
                  [140, 0, 255],
                  [255, 0, 255],
                  [255, 0, 180],
                  [255, 0, 90]
                ] %}
                {% set cur_rgb = state_attr(light_entity, 'rgb_color') %}
                {% set cur_mode = state_attr(light_entity, 'color_mode') %}
                {% if cur_mode != 'rgb' or cur_rgb is none %}
                  {{ palette[0] }}
                {% else %}
                  {% set ns = namespace(found=-1) %}
                  {% for c in palette %}
                    {% if c[0] == cur_rgb[0] and c[1] == cur_rgb[1] and c[2] == cur_rgb[2] %}
                      {% set ns.found = loop.index0 %}
                    {% endif %}
                  {% endfor %}
                  {% if ns.found != -1 %}
                    {% set next_idx = (ns.found + 1) % (palette | length) %}
                    {{ palette[next_idx] }}
                  {% else %}
                    {{ palette[0] }}
                  {% endif %}
                {% endif %}

      - conditions:
          - condition: template
            value_template: "{{ action == 'refresh' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light_entity, 'color_mode') == 'color_temp' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ light_entity }}"
                    data:
                      rgb_color: [255, 0, 0]
            default:
              - action: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"
                data:
                  color_temp_kelvin: 3000
