blueprint:
  name: EGLO 99099 Remote - Zigbee2MQTT RGB-CCT Steuerung
  description: Zuverlässige Steuerung eines RGB-CCT LED-Streifens über Zigbee2MQTT MQTT-Trigger inkl. Gruppenwahl, Farbzyklus und Moduswechsel.
  domain: automation
  input:
    mqtt_topic:
      name: Zigbee2MQTT Base Topic der Fernbedienung
      description: Das MQTT-Topic der Fernbedienung (z. B. zigbee2mqtt/Paula Remote).
      default: "zigbee2mqtt/Paula Remote"
      selector:
        text: {}
    target_group:
      name: Fernbedienungsgruppe
      description: Welche Gruppe der Fernbedienung (1, 2 oder 3) soll diesen Streifen steuern?
      default:
      selector:
        number:
          min: 1
          max: 3
          mode: box
    target_light:
      name: LED-Streifen
      description: Die zu steuernde Light-Entität (z. B. light.led_streifen).
      selector:
        entity:
          filter:
            - domain: light
    favorite_1_color:
      name: Favorit 1 RGB-Farbe (Recall_1)
      default: [255, 140, 0]
      selector:
        color_rgb: {}
    favorite_2_color:
      name: Favorit 2 RGB-Farbe (Recall_2)
      default: [160, 32, 240]
      selector:
        color_rgb: {}
    brightness_step:
      name: Helligkeitsschritt (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"
          mode: slider
    cct_step:
      name: Farbtemperaturschritt (Kelvin)
      default: 400
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: "K"
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: mqtt
    topic: !input mqtt_topic

condition:
  - condition: template
    value_template: >
      {% set pl = trigger.payload_json if trigger.payload_json is defined else {} %}
      {% set configured_group = (input_target_group | default(3)) | int %}
      {{ pl.action is defined and pl.action not in ['', none] and (pl.action_group | default(0) | int) == configured_group }}

action:
  - variables:
      pl: "{{ trigger.payload_json }}"
      action: "{{ pl.action }}"
      light_entity: !input target_light
      step_pct: !input brightness_step
      step_k: !input cct_step
      fav1: !input favorite_1_color
      fav2: !input favorite_2_color

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ action == 'on' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'off' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ light_entity }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'brightness_step_up' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness_step_pct: "{{ step_pct }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'brightness_step_down' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness_step_pct: "{{ -1 * step_pct }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'color_temperature_step_up' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              color_temp_kelvin: >
                {% set cur_k = state_attr(light_entity, 'color_temp_kelvin') | default(3000, true) | int %}
                {% set max_k = state_attr(light_entity, 'max_color_temp_kelvin') | default(6500, true) | int %}
                {{ [cur_k + step_k, max_k] | min }}

      - conditions:
          - condition: template
            value_template: "{{ action == 'color_temperature_step_down' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              color_temp_kelvin: >
                {% set cur_k = state_attr(light_entity, 'color_temp_kelvin') | default(3000, true) | int %}
                {% set min_k = state_attr(light_entity, 'min_color_temp_kelvin') | default(2200, true) | int %}
                {{ [cur_k - step_k, min_k] | max }}

      - conditions:
          - condition: template
            value_template: "{{ action == 'red' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: [255, 0, 0]

      - conditions:
          - condition: template
            value_template: "{{ action == 'green' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: [0, 255, 0]

      - conditions:
          - condition: template
            value_template: "{{ action == 'blue' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: [0, 0, 255]

      - conditions:
          - condition: template
            value_template: "{{ action == 'recall_1' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: "{{ fav1 }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'recall_2' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              rgb_color: "{{ fav2 }}"

      - conditions:
          - condition: template
            value_template: "{{ action == 'refresh_colored' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
             rgb_color: >
                {% set palette = [
                  [255, 0, 0],
                  [255, 64, 0],
                  [255, 128, 0],
                  [255, 192, 0],
                  [255, 255, 0],
                  [128, 255, 0],
                  [0, 255, 0],
                  [0, 255, 128],
                  [0, 255, 255],
                  [0, 128, 255],
                  [0, 0, 255],
                  [75, 0, 255],
                  [140, 0, 255],
                  [255, 0, 255],
                  [255, 0, 180],
                  [255, 0, 90]
                ] %}
                {% set cur_rgb = state_attr(light_entity, 'rgb_color') %}
                {% set cur_mode = state_attr(light_entity, 'color_mode') %}
                {% if cur_mode != 'rgb' or cur_rgb is none %}
                  {{ palette[0] }}
                {% else %}
                  {% set ns = namespace(found=-1) %}
                  {% for c in palette %}
                    {% if c[0] == cur_rgb[0] and c[1] == cur_rgb[1] and c[2] == cur_rgb[2] %}
                      {% set ns.found = loop.index0 %}
                    {% endif %}
                  {% endfor %}
                  {% if ns.found != -1 %}
                    {% set next_idx = (ns.found + 1) % (palette | length) %}
                    {{ palette[next_idx] }}
                  {% else %}
                    {{ palette[0] }}
                  {% endif %}
                {% endif %}

      - conditions:
          - condition: template
            value_template: "{{ action == 'refresh' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(light_entity, 'color_mode') == 'color_temp' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ light_entity }}"
                    data:
                      rgb_color: [255, 0, 0]
            default:
              - action: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"
                data:
                  color_temp_kelvin: 3000
